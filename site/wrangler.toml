# The official download site (Cloudflare Pages, deployed from this folder of the repository; see site/README.md).
# The APKs are not in the repository: they live in the R2 bucket below, uploaded by dm/android/tools/publish_cf.py,
# and functions/download.js hands one out only after a Turnstile check.
name = "galar-native"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

[vars]
# The Turnstile widget's site key (public; Cloudflare dashboard, Turnstile). Its secret key is a Pages secret: TURNSTILE_SECRET.
TURNSTILE_SITEKEY = "0x4AAAAAAF6QctkzjN5JF401"

[[r2_buckets]]
binding = "APKS"
bucket_name = "galar-native-apks"
